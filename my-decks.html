<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Decks | Origins TCG Crimson Cup</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="page-header">
    <h1>Origins TCG Crimson Cup</h1>
  </header>

  <!-- The menu. class="active" highlights the page you're on. -->
  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="deck-builder.html">Deck Builder</a>
    <a href="my-decks.html" class="active">My Decks</a>
    <a href="match-history.html">Match History</a>
    <!-- Sign in / sign out. Filled in by firebase.js -->
    <div class="auth-area" id="auth-area"></div>
  </nav>

  <main>
    <!-- "Sign in to see your decks", "Loading...", errors... -->
    <p class="page-status" id="page-status"></p>

    <!-- Shown after the deck lock time -->
    <p class="lock-notice hidden" id="lock-notice">🔒 Deck lock has passed. Tournament decks can't be changed any more.</p>

    <h2 class="section-title">Tournament decks <span class="dim" id="tournament-count"></span></h2>

    <!-- "Add 3 decks to verify decks" / "All 3 decks are valid" / "1 deck needs changes" -->
    <div class="verify-status hidden" id="verify-status"></div>

    <div class="deck-list" id="tournament-decks"></div>

    <h2 class="section-title">General decks</h2>
    <div class="deck-list" id="general-decks"></div>

    <p><a class="text-link" href="deck-builder.html">+ Build a new deck</a></p>
  </main>

  <!-- Normal scripts first, then the modules -->
  <script src="settings.js"></script>
  <script src="cards.js"></script>
  <script src="common.js"></script>
  <script src="modal.js"></script>
  <script type="module" src="firebase.js"></script>
  <script type="module" src="my-decks.js"></script>
</body>

</html>
