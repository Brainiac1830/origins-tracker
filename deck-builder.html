<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deck Builder | Origins TCG Crimson Cup</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="page-header">
    <h1>Origins TCG Crimson Cup</h1>
  </header>

  <!-- The menu. class="active" highlights the page you're on. -->
  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="deck-builder.html" class="active">Deck Builder</a>
    <!-- Sign in / sign out. Filled in by firebase.js -->
    <div class="auth-area" id="auth-area"></div>
  </nav>

  <main>
    <!-- Two columns: the card list on the left, "My deck" on the right -->
    <div class="builder-layout">

      <!-- ===== LEFT: all the cards ===== -->
      <section>
        <p class="hint">Left-click: view card &nbsp;·&nbsp; Right-click: add to / remove from deck</p>

        <h2 class="section-title">Heroes</h2>
        <!-- Empty for now: deck-builder.js fills it with the hero cards -->
        <div class="card-grid" id="hero-grid"></div>

        <h2 class="section-title">Cards</h2>
        <!-- Empty for now: deck-builder.js fills it with the other cards -->
        <div class="card-grid" id="card-grid"></div>
      </section>

      <!-- ===== RIGHT: my deck ===== -->
      <aside class="deck-panel">
        <h2 class="section-title">My deck</h2>

        <!-- The deck's name. <label> is the text above the box; its "for"
             matches the box's id, so clicking the text also puts the cursor in the box.
             maxlength stops very long names. -->
        <label class="field-label" for="deck-name">Deck name</label>
        <input type="text" id="deck-name" class="text-input" placeholder="e.g. Dracula Discard" maxlength="40">

        <!-- The counters, e.g. "Hero 1/1" and "Cards 5/12". Filled by deck-builder.js -->
        <div class="deck-counters" id="deck-counters"></div>

        <div class="deck-buttons">
          <!-- Save and Add need the database, which we set up in steps 5–6 -->
          <button class="btn" id="save-btn" disabled title="Coming in step 6">Save</button>
          <button class="btn" id="add-btn" disabled title="Coming in step 6">Add to my deck</button>
          <button class="btn btn-danger" id="reset-btn">Reset</button>
        </div>
        <!-- Short messages like "Your deck is full" appear here -->
        <p class="deck-message" id="deck-message"></p>

        <h3 class="deck-subtitle">Hero</h3>
        <div id="deck-hero"></div>

        <h3 class="deck-subtitle">Cards <span class="dim">(each counts ×2)</span></h3>
        <div id="deck-cards"></div>

      </aside>

    </div>
  </main>

  <!-- ---------- The big card view (the "modal") ----------
       It exists on the page all the time, but the class "hidden" keeps it
       invisible. Clicking a card removes "hidden", which makes it appear. -->
  <div class="modal hidden" id="card-modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <img id="modal-image" src="" alt="">
    </div>
  </div>

  <!-- Load the card list FIRST, then the code that uses it -->
  <script src="cards.js"></script>
  <script src="deck-builder.js"></script>
  <!-- type="module" lets this file use "import" -->
  <script type="module" src="firebase.js"></script>
</body>

</html>
